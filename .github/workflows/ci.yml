# CI for the ray-tracing-shapely-optiland repository.
#
# Authored in the private monorepo at
# src-python/ray_tracing_shapely_optiland/.github/workflows/ci.yml, and
# published to this repository's root, because a satellite's published tree
# is rooted at its own package directory.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor and not a choice: optiland itself requires >=3.11,
        # so this distribution cannot support less whatever it declares.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        # The core comes from PyPI, through the dependency in pyproject.toml,
        # as it does for a user.
        # The [notebook] extra is not optional here. Without trame, trame-vtk
        # and trame-vuetify the VTK test files skip, and a green run would be
        # hiding every test that builds or renders a 3D view.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebook]"

      - name: A display for VTK
        # The snapshot tests render (window.Render()). Off-screen rendering
        # still needs an OpenGL context, and the runner has no X server and no
        # GPU: VTK then crashes the interpreter with a segmentation fault, which
        # pytest cannot report as a failure. A virtual X server with Mesa's
        # software OpenGL gives it one.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libegl1 libxrender1

      - name: Test
        run: xvfb-run -a pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check ray_tracing_shapely_optiland tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --outdir dist .
      # --strict, because plain `twine check` only warns on a missing
      # long_description and exits 0.
      - run: twine check --strict dist/*
