# Publish to PyPI: build the distribution, check it, upload it.
#
# Authored in the private monorepo at src-python/ray_tracing_shapely_optiland/.github/workflows/publish.yml, and published to this
# repository by the sync pipeline.
#
# A published GitHub Release uploads to PyPI. By hand (workflow_dispatch,
# on a tag: `gh workflow run publish.yml --ref vX.Y.Z -f index=testpypi`)
# it uploads to TestPyPI or PyPI, for a dry run first.
#
# Trusted publishing: PyPI accepts the upload because it comes from this
# repository, this workflow file and the named environment, as registered on
# the PyPI project. No token is stored anywhere.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    # Only in the public repository: the private monorepo carries this file
    # too, and has nothing to publish.
    if: github.repository == 'tiberavon/ray-tracing-shapely-optiland'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version
        # A release whose tag disagrees with pyproject.toml would put one
        # version on PyPI under another's name, and PyPI never takes a version
        # back.
        # By hand to PyPI, it must run on the tag too: from a branch the check fails.
        if: github.event_name == 'release' || inputs.index == 'pypi' || startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('./pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME}"
          echo "tag $tag, pyproject $version"
          test "$tag" = "v$version"
      - run: pip install build twine
      - run: python -m build --outdir dist .
      # --strict, because plain `twine check` only warns on a missing
      # long_description, and a blank PyPI page cannot be fixed for that version.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name != 'release' && inputs.index == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
