[build-system]
# >=77 for PEP 639: `license` as an SPDX string rather than a table.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-tracing-shapely-optiland"
version = "0.0.0"
description = "3D verification of ray_tracing_shapely nonimaging-optics designs via Optiland's non-sequential ray tracer -- scene assembly, notebook-embedded visualization, and ray/run persistence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Michele Benetti", email = "micheleben@gmail.com"},
    {name = "ray-tracing-shapely authors and contributors"},
]
keywords = ["ray-tracing", "optics", "optiland", "non-sequential", "simulation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # [radiometry] is not optional for this distribution. The scene bridge
    # imports `optical_elements`, whose __init__ eagerly imports `units`,
    # which imports pint. `optical_elements` sits outside core on purpose --
    # it is in bare_core_check's NON_CORE_PREFIXES -- so the extra has to be
    # declared by whoever needs it. Declared bare, `pip install
    # ray-tracing-shapely-optiland` succeeded and then raised
    # ModuleNotFoundError: No module named 'pint' on the first import.
    # Measured: radiometry alone is sufficient; eye-safety and agentic are not
    # reached by anything this distribution imports.
    "ray-tracing-shapely[radiometry]>=0.2.0",
    "optiland",
]

[project.optional-dependencies]
notebook = [
    # Inline Jupyter 3D interaction; see
    # dev_doc/architecture/components/optiland_nsq_viewer.md.
    # Not a dependency of scene assembly itself -- see that document's directional-
    # dependency contract (optiland_scene_bridge must not import optiland_nsq_viewer).
    "trame",
    "trame-vtk",
    "trame-vuetify",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/tiberavon/ray-tracing-shapely-optiland"
Repository = "https://github.com/tiberavon/ray-tracing-shapely-optiland"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ray_tracing_shapely_optiland", "ray_tracing_shapely_optiland.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The same blocking set as the core distribution: pyflakes finds real
# defects rather than style. Without this section ruff falls back to its own
# defaults -- 88 columns and a wider ruleset -- and this distribution would
# report 83 findings instead of none, which is a lint job red on arrival.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
